name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked fails the run if uv.lock is stale or missing rather than
      # silently re-resolving. Without it a committed lockfile is decoration:
      # CI would still drift on a transitive release and the green check would
      # describe a dependency set nobody chose. See issue #79.
      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run linter
        run: uv run ruff check src tests

      - name: Run type checker
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -v
        env:
          GEMINI_API_KEY: "test_key_for_ci"

  live-l3:
    name: Live L3 Detection (Gemini)
    runs-on: ubuntu-latest
    env:
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # Runs the corpus attacks through live Gemini and fails only on a genuine
      # detection regression. Skipped without the key (fork PRs); skips itself as
      # inconclusive on a provider outage, so Google availability never reddens a PR.
      - name: Run live L3 detection
        if: env.HAS_GEMINI_KEY == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRENTINA_LIVE_L3: "1"
          QUARANTINE_MODEL: "gemini-2.5-flash"
        run: uv run pytest tests/test_l3_live.py -v

  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0.5.0

  build-container:
    runs-on: ubuntu-latest
    env:
      HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: |
          docker build -f Containerfile --build-arg HF_TOKEN=${{ secrets.HF_TOKEN }} -t mcp-trentina:test .

      - name: Verify container starts
        run: |
          timeout 5 docker run --rm mcp-trentina:test || true

      - name: Build test runner image (adds shell + pytest to distroless)
        run: |
          docker build -f - -t mcp-trentina:test-runner . <<'EOF'
          FROM quay.io/hummingbird/python:latest-builder AS test-deps
          USER 0
          RUN pip install --no-cache-dir --prefix=/usr pytest pytest-asyncio

          FROM mcp-trentina:test
          COPY --from=test-deps /usr/lib/python3.14/site-packages/ /usr/lib/python3.14/site-packages/
          EOF

      - name: Run L2 integration tests in container
        run: |
          docker run --rm \
            --entrypoint python \
            -v ${{ github.workspace }}/tests:/tests:ro \
            -e GEMINI_API_KEY="test_key_for_ci" \
            -e CLASSIFIER_MODEL_PATH="/models/prompt-guard-2-22m" \
            mcp-trentina:test-runner \
            -m pytest /tests/test_l2_integration.py -v

      - name: Run L3 integration tests in container
        if: env.HAS_GEMINI_KEY == 'true'
        run: |
          docker run --rm \
            --entrypoint python \
            -v ${{ github.workspace }}/tests:/tests:ro \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e CLASSIFIER_MODEL_PATH="/models/prompt-guard-2-22m" \
            mcp-trentina:test-runner \
            -m pytest /tests/test_l3_integration.py -v

  validate-constitution:
    name: Constitution Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: crunchtools/constitution
          path: .constitution

      - name: Validate constitution
        run: python3 .constitution/validate-constitution.py .specify/memory/constitution.md --verbose
