name: Collect - wild feed

# What agents are actually sent (#357): benchmarks/wild_feed.py reads a day's
# sample of Moltbook's public posts and comments, and every judge that ships a
# prompt pack gives its verdict on each document. `replay` also hands every
# document to two cheap models with decoy tools, as benchmarks/detonation.py
# does for the written corpus. The last job prints the documents worth
# reading: flagged by any judge, split between judges, or tripped.
#
# Daily, and by hand. It spends money and runs the checked-out code with
# OPENROUTER_API_KEY in its environment, so it runs merged code only, as
# live-l3 in ci.yml does. The collecting job holds no key: it is the one that
# reads the hostile feed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Documents to collect at most"
        type: number
        default: 300
      replay:
        description: "Also run every document past two decoy models, five draws each"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect:
    name: collect
    # A dispatch can name any branch. Only main is reviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Collect
        env:
          LIMIT: ${{ inputs.limit || 300 }}
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/wild_feed.py --limit "$LIMIT" --json wild.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload documents
        uses: actions/upload-artifact@v7
        with:
          name: wild-documents
          path: wild.json
          retention-days: 30

  read:
    name: ${{ matrix.mode }} ${{ matrix.model }}
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One per file in src/trentina/quarantine/prompt_packs/, three votes
          # as the packs were measured.
          - { mode: judge, model: google/gemini-2.5-flash-lite, flags: "--votes 3" }
          - { mode: judge, model: google/gemini-3.5-flash-lite, flags: "--votes 3" }
          - { mode: judge, model: anthropic/claude-haiku-4.5, flags: "--votes 3" }
          - { mode: judge, model: google/gemini-3.8-flash, flags: "--votes 3", reasoning: minimal }
          # The two that tripped on attacks and almost never on benign text.
          - { mode: detonate, model: openai/gpt-oss-20b, flags: "--votes 5 --temperature 0.7" }
          - { mode: detonate, model: google/gemma-3-12b-it, flags: "--votes 5 --temperature 0.7" }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Download the documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name wild-documents --dir .

      - name: Read every document
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
          MODE: ${{ matrix.mode }}
          FLAGS: ${{ matrix.flags }}
          REPLAY: ${{ inputs.replay }}
        run: |
          set -o pipefail
          # A job's own `if` cannot see the matrix, so the replay is skipped here.
          if [ "$MODE" = detonate ] && [ "$REPLAY" != true ]; then
            echo "Replay not asked for."
            exit 0
          fi
          # FLAGS is a fixed list of options from the matrix above, split on purpose.
          # shellcheck disable=SC2086
          uv run --no-sync python benchmarks/detonation.py \
            --mode "$MODE" --documents wild.json --concurrency 6 $FLAGS \
            --json detonation.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
          MODE: ${{ matrix.mode }}
        run: echo "name=wild-${MODE}-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('detonation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: detonation.json
          retention-days: 30

  reading-list:
    name: reading list
    needs: read
    # Reads artifacts only: no key, and it runs even if one model's job failed.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Download the run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'wild-*' --dir results

      - name: What to read
        run: |
          set -o pipefail
          shopt -s nullglob
          uv run --no-sync python benchmarks/detonation.py --mode venn \
            --judge-json results/wild-judge-*/detonation.json \
            --detonate-json results/wild-detonate-*/detonation.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
