# Trentina is distributed as a container image only (Security Gateway profile,
# I). It was on PyPI through 0.54.1; nothing is published there any more.
name: Publish the Cockpit RPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for uploading release assets

    steps:
      - uses: actions/checkout@v7

      - name: Install rpm-build
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build cockpit-trentina RPM
        run: make rpm

      - name: Verify RPM
        run: rpm -qip dist/noarch/cockpit-trentina-*.noarch.rpm

      - name: Upload RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/noarch/cockpit-trentina-*.noarch.rpm

      - name: Upload RPM as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-trentina-rpm
          path: dist/noarch/cockpit-trentina-*.noarch.rpm
