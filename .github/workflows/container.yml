name: Container Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/mcp-trentina
  GHCR_IMAGE: ghcr.io/crunchtools/mcp-trentina

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.QUAY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # The version belongs to the package, not to the ref that triggered the
      # build. docker/metadata-action's `version` output is the BRANCH NAME on a
      # branch push (so main builds labelled themselves "main"); the semver only
      # appears on tag pushes. Read pyproject.toml, which is the single source.
      - name: Read package version
        id: pkgver
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
            VERSION=${{ steps.pkgver.outputs.version }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.QUAY_IMAGE }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          version: "v0.68.2"

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # The version belongs to the package, not to the ref that triggered the
      # build. docker/metadata-action's `version` output is the BRANCH NAME on a
      # branch push (so main builds labelled themselves "main"); the semver only
      # appears on tag pushes. Read pyproject.toml, which is the single source.
      - name: Read package version
        id: pkgver
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
            VERSION=${{ steps.pkgver.outputs.version }}
