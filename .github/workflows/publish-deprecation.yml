name: Publish Deprecation Package

on:
  workflow_dispatch:

jobs:
  publish-deprecation:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Single-version job: pinned to the NEWEST supported Python, which is
      # what the container runs. Anything that cannot run across the whole
      # matrix is tested on production's version. See constitution III.
      - name: Set up Python
        run: uv python install 3.14

      - name: Build deprecation package
        working-directory: deprecation
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: deprecation/dist/
