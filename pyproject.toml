[project]
name = "mcp-trentina-crunchtools"
version = "0.16.0"
description = "Secure MCP gateway and quarantine for AI agent traffic — three-layer defense against prompt injection"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["mcp", "security", "prompt-injection", "sanitization", "quarantine", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=4.0,<5.0",
    # The MCP SDK is a DIRECT dependency, not one inherited through fastmcp.
    # fastmcp governs how trentina is a server; the SDK governs how it is a
    # client to ~20 backends (gateway/backend.py dials the raw SDK). Leaving
    # the SDK implicit let the server framework silently pick the client's
    # protocol stack, which made the gateway the version ceiling for its own
    # fleet. Bound them separately so each side can move on its own.
    "mcp>=2.2,<3.0",
    # petit, as a library. Layer 1's line grouping (preprocess/petit.py).
    # 3.0.0 renamed the distribution to petit-log and the import to petit;
    # it is the first release that is deterministic, returns verbatim
    # samples, and lets the caller supply its own normalization policy.
    "petit-log>=3.0.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.14",
    "onnxruntime>=1.17",
    "transformers>=4.40",
    "numpy>=1.24",
    "dbus-fast>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-trentina-crunchtools = "mcp_trentina_crunchtools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trentina_crunchtools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
# Audited rule by rule (RT #1482) by emptying this list and counting real hits
# against `src` and `tests` separately -- the scope CI lints. PIE790, S105 and
# RUF022 had ZERO hits and were deleted. S101 had 1597 hits, every one of them
# in tests/, and moved to per-file-ignores below; it was never a src concern.
# The seven that remain are all genuinely package-wide in src/.
ignore = [
    "TRY003",   # 100 hits: exception messages built at the raise site
    "TID252",   # 141 hits: this package's own internal relative imports
    "PLC0415",  # 48 hits: deferred CLI imports and optional-dependency imports
                #   (e.g. `from .dbus_interface import start_dbus` only when
                #   --no-dbus is absent), concentrated in __init__ and dbus_interface
    "PLW0603",  # 29 hits: module-level lazy singletons
    "PLR0913",  # 12 hits: MCP tool signatures mirror the wire API
    "PLR2004",  # 10 hits: HTTP status codes and byte limits
    "PLR0917",  # 6 hits: ditto, positional
    "UP042",    # 4 hits: `class X(str, Enum)` -> StrEnum. Surfaced by raising
                #   target-version to py311, not by any code change. Every use
                #   site goes through .value or .name (checked), so the swap
                #   looks safe -- but these enums land in persisted audit rows
                #   (Outcome) and cache keys (Provenance), and StrEnum changes
                #   what str() returns. That is a deliberate migration with its
                #   own blast radius, not fallout from a Python floor bump.
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# S603: the integration tests launch a real MCP backend and a fastmcp-free
# interpreter as subprocesses. Both argv lists are literals naming this repo's
# own modules and sys.executable -- there is no untrusted input to check, and
# the alternative (never starting a real server) is what let a production
# breakage through a green CI run in the first place.
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "PLC0415", "PLR2004", "ARG002", "ARG005", "RUF003", "PT018", "TC003"]
"src/mcp_trentina_crunchtools/dbus_interface.py" = ["UP037", "C901", "TRY300"]
"src/mcp_trentina_crunchtools/gateway/app.py" = ["C901", "PLR0911", "PLR0912"]
# Request handler: each early return is a distinct HTTP failure response
# (401, 404, 500, ...). Same shape as gateway/app.py above.
"src/mcp_trentina_crunchtools/gateway/alert_ingress.py" = ["PLR0911"]
# E402: the benchmark inserts the repo root on sys.path before importing the
# corpus and package, so those imports intentionally follow that setup.
# PLR0915: render_markdown is a linear report builder — many append statements,
# no real branching. Kept inline (one caller) to satisfy Gourmand's
# single-use-helper rule rather than split into helpers.
"benchmarks/provider_benchmark.py" = ["E402", "PLR0915"]

[tool.mypy]
# NOT the 3.11 floor, deliberately. numpy's bundled stubs use PEP 695 `type X =`
# syntax, which mypy refuses to parse under python_version = "3.11":
#   numpy/__init__.pyi: error: Type statement is only supported in Python 3.12
#   and greater  [syntax]
# That is a blocking error, so type checking stops entirely. 3.11 compatibility
# is instead enforced where it actually bites -- ruff's target-version = py311,
# and the CI matrix running the full suite on 3.11, which would fail at import
# on any 3.12-only syntax.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["markdownify", "bs4", "onnxruntime", "transformers", "dbus_fast", "dbus_fast.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# petit-log 3.0.0 is tagged and built but not yet uploaded to PyPI, so dev
# and CI resolution is pinned to the tag. The `petit-log>=3.0.0` requirement
# above is the real dependency and is what consumers install. Removing this
# block is tracked in issue #96 and is blocked on a human with PyPI
# credentials running the upload.
[tool.uv.sources]
petit-log = { git = "https://github.com/crunchtools/petit.git", tag = "v3.0.0" }

# petit-log ships no type information — it is a long-lived tool whose library
# surface was added recently and whose internals carry no annotations. Only
# preprocess/petit.py imports it.
[[tool.mypy.overrides]]
module = ["petit"]
ignore_missing_imports = true
