<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  com.crunchtools.Trentina1 is the host operator's interface (#298).

  Only root and members of the `trentina` group may own the name, call it or
  receive its signals. Run the service as a member of that group (or as root),
  and use Cockpit with administrative access. The default context denies all
  three: before this, any local user could own the name and impersonate the
  service, or call GetRecentEvents and GetTrustConfig.
-->
<busconfig>
  <policy user="root">
    <allow own="com.crunchtools.Trentina1"/>
    <allow send_destination="com.crunchtools.Trentina1"/>
    <allow receive_sender="com.crunchtools.Trentina1"/>
  </policy>
  <policy group="trentina">
    <allow own="com.crunchtools.Trentina1"/>
    <allow send_destination="com.crunchtools.Trentina1"/>
    <allow receive_sender="com.crunchtools.Trentina1"/>
  </policy>
  <policy context="default">
    <deny own="com.crunchtools.Trentina1"/>
    <deny send_destination="com.crunchtools.Trentina1"/>
    <deny receive_sender="com.crunchtools.Trentina1"/>
  </policy>
</busconfig>
