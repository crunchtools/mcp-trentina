# ---------------------------------------------------------------------------
# Findings reviewed while migrating to gourmand 0.16.5 (RT #1482).
# ---------------------------------------------------------------------------

# Fan-out error isolation. One failing recipient must not abort the others, so
# these handlers log with context and continue. That is the designed behaviour,
# not a swallowed error -- every one of them records the exception.

[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_trentina_crunchtools/gateway/sessions.py"
justification = "Notifying one session must not abort notification of the rest, so a per-session failure is logged with exc_info and the loop continues. Re-raising would let a single dead subscriber silence every other session."
classification = "by_design"

[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_trentina_crunchtools/gateway/compress.py"
justification = "Pre-compressing one backend must not abort the sweep over the others; the failure is logged with exc_info and the loop continues. The missing exc_info on this handler was a real gap and is fixed in this change."
classification = "by_design"

[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_trentina_crunchtools/client.py"
justification = "fetch()'s HTTPStatusError handler best-effort-decodes the error response body for diagnostics before raising FetchError. A failure to decode is logged at debug and the decode is simply skipped (error_body stays None) -- raising from this enrichment step would mask the real HTTPStatusError being converted into FetchError two lines below. (Previous justification here described a client teardown/close() path that does not exist in this file; corrected to describe the actual code.)"
classification = "by_design"

[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_trentina_crunchtools/dbus_interface.py"
justification = "D-Bus is optional -- the server runs with --no-dbus and the import itself is deferred. A D-Bus failure is logged and the server continues without it rather than taking down the MCP server for an optional integration."
classification = "by_design"

# Lazy-singleton HTTP client accessors. Three proxies each own one client with
# its own timeout and header policy; sharing one would couple their lifetimes.

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/gateway/alert_ingress.py"
justification = "_get_alert_client is the lazy-singleton accessor for this proxy's own httpx client. It is called once because there is one place the client is needed, and it exists so the client is constructed on first use rather than at import."
classification = "by_design"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/gateway/llm_proxy.py"
justification = "_get_llm_client is the lazy-singleton accessor for this proxy's own httpx client, with the LLM-specific timeout. Same idiom as alert_ingress and matrix_proxy; merging them would couple three independent proxies' client lifetimes."
classification = "by_design"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/gateway/matrix_proxy.py"
justification = "_get_matrix_client is the lazy-singleton accessor for this proxy's own httpx client. Same idiom as alert_ingress and llm_proxy."
classification = "by_design"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/client.py"
justification = "_build_redirect_chain is 17 lines of redirect-following bookkeeping. Keeping it out of the request path is what makes that path readable; it is called once because there is one place redirects are followed."
