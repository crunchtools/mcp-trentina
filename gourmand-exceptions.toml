[[exceptions]]
check = "generic_names"
path = "src/mcp_trentina_crunchtools/gateway/router.py"
pattern = "result"
justification = "result is the JSON-RPC 2.0 wire-protocol field name for success responses (https://www.jsonrpc.org/specification §5.1); renaming would obscure the protocol mapping"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/__init__.py"
pattern = "_run_with_gateway"
justification = "Configuration gate isolated from the main() match statement so the gateway-disabled path stays a single mcp.run() call with no imports of starlette/uvicorn at startup time"

[[exceptions]]
check = "lint_suppression"
path = "src/mcp_trentina_crunchtools/__init__.py"
pattern = "type: ignore"
justification = "Starlette's lifespan callable type signature uses opaque generics; the [no-untyped-def] ignore is the standard pattern for framework-supplied callbacks"

[[exceptions]]
check = "lint_suppression"
path = "src/mcp_trentina_crunchtools/gateway/app.py"
pattern = "type: ignore"
justification = "FastMCP's custom_route decorator has no type stubs; the [misc] ignore is the standard pattern for typed code calling into untyped framework APIs"

[[exceptions]]
check = "summary_litter"
path = "deprecation/README.md"
pattern = "README.md"
justification = "PyPI requires README.md in the deprecation shim package — it tells users the package was renamed to mcp-trentina-crunchtools"

[[exceptions]]
check = "lint_suppression"
path = "deprecation/src/mcp_airlock_crunchtools/__init__.py"
pattern = "noqa: F401,F403"
justification = "Wildcard re-export is the entire purpose of the deprecation shim — it forwards all public names from the renamed package"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/gateway/sessions.py"
pattern = "_remove"
justification = "Called from 3 sites: delete_session, create_session (eviction loop), and _expire_stale — gourmand miscounted because create_session calls it inside a while loop"

[[exceptions]]
check = "single_use_helpers"
path = "tests/test_gateway_router.py"
pattern = "_profile"
justification = "Called from 19 sites across the module — gourmand miscounts when the helper is also called from the last class in the file (same class of miscount as the sessions.py _remove exception)"

[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_trentina_crunchtools/gateway/circuit.py"
pattern = "_notify"
justification = "Circuit breaker callbacks must not crash the breaker — catching and logging ensures a broken notification callback cannot prevent circuit state from updating correctly"

[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_trentina_crunchtools/__init__.py"
pattern = "on_circuit_change"
justification = "Circuit state change handler catches RuntimeError when no event loop is available (sync context during testing) — legitimate fallback to skip async notification"

[[exceptions]]
check = "conditional_wrapper"
path = "src/mcp_trentina_crunchtools/__init__.py"
pattern = "on_circuit_change"
justification = "Early returns filter out non-notifiable state transitions (e.g. OPEN→HALF_OPEN probe) before expensive broadcast — guard clauses not conditional wrapping"

[[exceptions]]
check = "primitive_obsession"
path = "demo/attack-sim/payload/struct.py"
justification = "The chr() codes ARE the attack. This file is a working stdlib `struct` shadow whose obfuscation (46,115,116,97,116,117,115 spelling '.status', plus 49 for '1') is precisely what sanitize/shadows.py detects and tests/test_shadows.py asserts on. Naming these constants would destroy the artifact and weaken the detection tests"

[[exceptions]]
check = "random_scripts"
path = "demo/**"
justification = "demo/ holds the attack-simulation harness — build_archive.py, server.py and the two run.sh drivers are standalone scripts by design, not library code. They exist to be run by hand when demonstrating the defense"

[[exceptions]]
check = "single_use_helpers"
path = "demo/attack-sim/server.py"
pattern = "_encode_b85z"
justification = "Attack payload encoder for the demo archive. Each encoding is deliberately a distinct named step so the demo can show which obfuscation the pipeline caught"

[[exceptions]]
check = "single_use_helpers"
path = "demo/attack-sim/server.py"
pattern = "_encode_xor_b64"
justification = "Attack payload encoder for the demo archive. Each encoding is deliberately a distinct named step so the demo can show which obfuscation the pipeline caught"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/sanitize/shadows.py"
pattern = "_scan_for_obfuscation"
justification = "Called from one production site but ten test sites (tests/test_shadows.py imports it directly and exercises each indicator category independently). It is a cohesive, separately-tested scanning primitive; inlining a 50-line scanner into the file walker would make both harder to read and drop the unit tests"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_trentina_crunchtools/tools/fetch.py"
pattern = "_build_advisory"
justification = "Miscount — called from three sites (fetch.py:140, :151, :172), same class of gourmand miscount as the sessions.py _remove and _profile exceptions above"

# --- Surfaced by restoring the [thresholds] block in gourmand.toml. ---
# Until now this repo ran with every threshold silently zeroed, which switched
# off the checks that need a minimum size to fire. These are what they found.

[[exceptions]]
check = "over_abstraction"
path = "src/mcp_trentina_crunchtools/errors.py"
justification = "_scrub_credentials is a named security boundary. It is the one place error text is stripped of keys, tokens and passwords before it can reach a log or a client; inlining the regex at each raise site is exactly how one of them gets missed."

[[exceptions]]
check = "over_abstraction"
path = "src/mcp_trentina_crunchtools/gateway/app.py"
justification = "_plain has twenty call sites. It is not an abstraction to remove, it is the response builder those twenty routes share."

[[exceptions]]
check = "over_abstraction"
path = "src/mcp_trentina_crunchtools/gateway/context.py"
justification = "get_current_profile reads a ContextVar. The wrapper is the point: callers get the profile without touching the contextvar, and the None-outside-gateway-context behaviour is documented in one place."

[[exceptions]]
check = "over_abstraction"
path = "src/mcp_trentina_crunchtools/sanitize/pipeline.py"
justification = "Two findings. PipelineStats.risk_level delegates to risk_level_for_count, which exists so callers that aggregate detections across several PipelineStats (alert ingress) classify risk identically. sanitize_text is a one-liner only because the stages it shared with sanitize() were just extracted into _run_text_stages; it remains a distinct public entry point with its own contract."

[[exceptions]]
check = "over_abstraction"
path = "src/mcp_trentina_crunchtools/tools/scan.py"
justification = "_risk_order is a dict lookup with a safe default. The name is what makes the comparison at the call site readable."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/database.py"
justification = "record_detection, save_compression and save_tool_list write to three different tables with different columns; is_blocked and is_domain_blocked read the same table on different columns. What they share is connect, execute, commit. Collapsing them means passing table and column names into the SQL as strings, which trades readable auditable literal queries for dynamic SQL in a security gateway. Not a trade worth making."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/config.py"
justification = "is_trusted_domain and is_trusted_path consult different allowlists with different matching rules — hostname suffix versus fnmatch globbing. They share the shape of the not-a-list guard, nothing else."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/circuit.py"
justification = "record_success and record_failure share their first two lines and then diverge completely: one closes the circuit and resets the counter, the other increments it and may re-open or trip. Merging opposite state transitions to save two lines would be a poor trade in the component that decides whether a backend is reachable."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/alert_ingress.py"
justification = "_get_alert_client, _get_llm_client and _get_matrix_client are the three-line lazy-singleton accessor, once per proxy. The duplication is the idiom."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/llm_proxy.py"
justification = "_get_llm_client is the three-line lazy-singleton accessor, matching the same idiom in matrix_proxy and alert_ingress."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/backend.py"
justification = "reset_tool_list_cache and reset_profile_tools_cache each clear one module-level cache for tests. Four statements, two different globals."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/compress.py"
justification = "set_profiles and register_internal_server are both three-line module-global setters called once at startup. They assign different globals."

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/profile.py"
justification = "Four Pydantic field validators that each match a different value against a different pattern and raise a message naming the field that was wrong. The per-field message is what makes a bad profiles.yaml diagnosable; they share only the match-then-raise shape."

[[exceptions]]
check = "copy_paste_detection"
path = "benchmarks/provider_benchmark.py"
justification = "detection_rate/fp_rate and detection_by_category/fp_by_category compute the true-positive and false-positive halves of the same report. Reporting them as a matched pair is the point of the benchmark."

[[exceptions]]
check = "primitive_obsession"
path = "src/mcp_trentina_crunchtools/defense.py"
pattern = "_should_run_l3"
justification = "is_trusted and l3_gate are two independent, orthogonal predicates on a private gate function (trust of the source vs. whether the caller runs L3 as a detector at all). Bundling them into a config object would add a type to carry two bools consumed one line apart — the over-abstraction the linter elsewhere forbids."

[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_trentina_crunchtools/gateway/llm_proxy.py"
pattern = "_schedule_completion_scan"
justification = "The post-hoc completion scan is a fire-and-forget background task. Its except/log is not redundant defensiveness — a scan crash MUST NOT propagate into the streaming task or the whole completion fails after already reaching the client. Swallow-and-log is the required behaviour, and the finding it records still lands in the detections table."

[[exceptions]]
check = "single_use_helpers"
path = "tests/test_defense_contract.py"
pattern = "_resolve"
justification = "Relative-import resolution is a non-trivial, correctness-critical algorithm (its docstring documents the exact hole a naive text match would leave). Same rationale as the _decode_base64_safe/_decode_hex_safe exceptions: a named, documented algorithm step, not a readability wrapper."
