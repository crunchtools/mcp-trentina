check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/loader.py"
justification = "_require_env is reported as 100% similar to register_matrix_routes in gateway/matrix_proxy.py on three statements. One reads a required secret from the environment and fails closed; the other registers Starlette routes. They share a guard-then-act shape and nothing else. The genuine duplication this check found in this file -- _resolve_bearer_token reimplementing _require_env line for line, despite _require_env's own docstring claiming to be shared by every token-in-env ingress -- was FIXED in this change rather than excepted."
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/__init__.py"
justification = "_build_oauth_context is reported as 100% similar to get_provider in quarantine/providers/__init__.py on nine statements. Both are factories -- resolve inputs, validate them, fail closed on a missing one, construct a provider, log, return -- but they share only that shape: different env vars, a GoogleProvider vs an LLM Provider, a ProfileConfigError vs a QuarantineAgentError, no shared control flow. Same over-match on the factory guard-then-construct shape as the loader.py _require_env exception above."
classification = "gourmand_bug"

# --- scan-view extractors: structural similarity, not copied code ---
# All three are short, generic shapes that any two independent
# implementations converge on. Collapsing them would couple modules that are
# deliberately independent -- the whole point of scanview/ being a sibling of
# preprocess/ rather than an extension is that the two must be free to diverge.

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/scanview/generic.py"
pattern = "GenericExtractor.select"
justification = "Flagged as similar to gateway/app.py:gateway_app. The shared shape is an accumulate-into-locals-then-construct loop, which is structural coincidence -- the two functions share no domain, no types and no caller."
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/gateway/scanview.py"
pattern = "build_extractor"
justification = "Flagged as similar to gateway/scope.py:resolve_backend. Both are three statements of registry-lookup-then-raise, which is what every lookup-or-fail-closed function looks like. Sharing a helper would put the security-relevant channel check behind an indirection."
classification = "gourmand_bug"

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_trentina_crunchtools/scanview/base.py"
pattern = "ScanView.coverage"
justification = "Flagged as similar to preprocess/base.py:PreProcessResult.ratio. Both are a guarded division. They are intentionally separate: ratio measures how much a payload SHRANK, coverage measures how much of it was READ, and merging them would imply the two driver types share a contract they specifically do not."
classification = "by_design"

# --- Matrix E2EE termination ---

[[exceptions]]
check = "hidden_env_config"
path = "tests/test_matrix_keybackup.py"
pattern = "CI"
justification = "Not a runtime toggle. This test reads CI to FAIL when the vodozemac wheel is missing on a CI leg, so the decryption suite cannot skip itself into a green run. It changes no production behaviour -- there is no CI check anywhere in src/ -- and the check it guards is documented in the test's own docstring."
classification = "by_design"

[[exceptions]]
check = "dead_structs"
path = "src/mcp_trentina_crunchtools/matrix/keybackup.py"
pattern = "KeyBackupProvider"
justification = "Instantiated in production by gateway/matrix_proxy.py::_provider_for, which builds it lazily on the first request that needs a room key. Gourmand does not see the construction because it happens inside an async factory behind an enabled-check."
classification = "gourmand_bug"

[[exceptions]]
check = "conditional_wrapper"
path = "tests/test_matrix_keybackup.py"
pattern = "handle"
justification = "httpx.MockTransport handler. Dispatching on the request path IS the function -- it stands in for a homeserver's routing table. Moving the condition to the call site would mean the call site is the transport, which is the thing being mocked."
classification = "gourmand_bug"

[[exceptions]]
check = "conditional_wrapper"
path = "tests/test_scanview_matrix.py"
pattern = "handle"
justification = "Same: an httpx.MockTransport handler routing by request path."
classification = "gourmand_bug"
