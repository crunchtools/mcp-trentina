[global]
excluded_paths = [
    ".git/**",
    ".venv/**",
    ".mypy_cache/**",
    ".ruff_cache/**",
    ".pytest_cache/**",
    ".github/**",
    "*.egg-info/**",
    "dist/**",
    "build/**",
    "uv.lock",
