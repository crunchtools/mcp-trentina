repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        files: \.py$
        stages: [pre-commit, pre-merge-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        files: \.py$
        stages: [pre-commit, pre-merge-commit]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit]

  # Gourmand runs from its container: the PyPI package of the same name
  # shadows the real binary on PATH, so a bare `gourmand` is the wrong tool.
  - repo: local
    hooks:
      - id: gourmand
        name: Gourmand (AI slop detection)
        entry: podman run --rm -v .:/src:Z -w /src quay.io/crunchtools/gourmand:latest check --full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      # Constitution XII (v1.17.0): reviews the STAGED diff from the image CI
      # runs, with the repo mounted read-only so its Constitution agent reads
      # ours. Blocks on critical/high. SKIP=gatehouse for a false positive —
      # then answer the same finding on the PR.
      - id: gatehouse
        name: Gatehouse (AI code review, staged diff)
        entry: bash -c 'git diff --cached | podman run --rm -i --env-file "$HOME/.config/mcp-env/gatehouse.env" -v .:/src:ro,Z -w /src quay.io/crunchtools/gatehouse:latest --stdin'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
